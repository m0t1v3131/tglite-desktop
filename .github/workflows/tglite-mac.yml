# Plume для Mac (Apple Silicon): Telegram Desktop + патч Plume (VPN через xray, своё обновление).
# Готовый Plume-Mac.zip — артефакт сборки; на plume.amdiveev.ru его выкладывают с ПК (desktop-native в m0t1v3131/tg-lite).
#
# Бесплатный Mac на GitHub (3 ядра) не успевает собрать Telegram за 6 ч одного задания, поэтому сборка идёт заходами:
# каждый заход компилирует до 5 ч, сохраняет папку сборки (out/) в кэш и, если программа не готова, сам запускает
# следующий заход (workflow_dispatch, attempt+1) — тот продолжает с того же места. Библиотеки — в отдельном кэше.
name: Plume Mac

on:
  push:
    branches: [tglite]
    paths-ignore: ['.github/**']  # правка сценариев не запускает пересборку (≈10 ч)
  workflow_dispatch:
    inputs:
      attempt:
        description: 'Номер захода (1 — с начала)'
        default: '1'
      build:
        description: 'Номер сборки (ггммддчч), общий для всех заходов'
        default: ''

permissions:
  actions: write
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 358
    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      XRAY_VERSION: "26.9.30"
      ATTEMPT: ${{ github.event.inputs.attempt || '1' }}
      MAX_ATTEMPTS: 4

    steps:
      - name: Get repository name.
        run: |
          echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV
          BUILD="${{ github.event.inputs.build }}"
          [ -n "$BUILD" ] || BUILD=$(date -u +%y%m%d%H)
          echo "TGLITE_BUILD=$BUILD" >> $GITHUB_ENV
          echo "Заход $ATTEMPT из $MAX_ATTEMPTS, сборка $BUILD"

      - name: Clone.
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share
          brew update
          brew install automake libtool meson nasm ninja pkg-config || true
          sudo mdutil -a -i off || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Libraries cache (restore).
        id: libs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-tglite-libs-full-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-tglite-libs-

      - name: Libraries.
        run: ./$REPO_NAME/Telegram/build/prepare/mac.sh silent

      # Освобождаем место, но исходники, которые библиотеки отдают в сборку (local/src, напр. wallet_engine.cpp), не трогаем.
      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/local/src/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      # Кэш библиотек сохраняем сразу — даже если сборка программы ниже не успеет, библиотеки (≈3 ч) не собирать заново.
      - name: Libraries cache (save).
        if: steps.libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-tglite-libs-full-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}

      # Папка сборки прошлого захода или прошлой сборки — Xcode перекомпилирует только изменённое.
      - name: Build cache (restore).
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.REPO_NAME }}/out
          key: ${{ runner.OS }}-plume-out-${{ env.TGLITE_BUILD }}-${{ env.ATTEMPT }}
          restore-keys: |
            ${{ runner.OS }}-plume-out-${{ env.TGLITE_BUILD }}-
            ${{ runner.OS }}-plume-out-

      - name: Plume build.
        id: build
        timeout-minutes: 285
        continue-on-error: true
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_AI_KEY: ${{ secrets.TG_AI_KEY }}
        run: |
          cd $REPO_NAME/Telegram
          sed -i '' "s/inline constexpr auto kBuild = [0-9]*;/inline constexpr auto kBuild = $TGLITE_BUILD;/" SourceFiles/tglite/tglite.h
          ./configure.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -D CMAKE_OSX_ARCHITECTURES=arm64 \
            -D TDESKTOP_API_ID=$TG_API_ID \
            -D TDESKTOP_API_HASH=$TG_API_HASH \
            -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
            -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
            -D TGLITE_AI_KEY=$TG_AI_KEY
          cmake --build ../out --config Release --parallel

      - name: Build cache (save).
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.REPO_NAME }}/out
          key: ${{ runner.OS }}-plume-out-${{ env.TGLITE_BUILD }}-${{ env.ATTEMPT }}

      - name: Next attempt.
        if: always() && steps.build.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
            echo "Не собралось за $MAX_ATTEMPTS захода — смотреть журнал."
            exit 1
          fi
          NEXT=$((ATTEMPT + 1))
          gh workflow run tglite-mac.yml -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f attempt=$NEXT -f build=$TGLITE_BUILD
          echo "Не успело за этот заход — запущен заход $NEXT, он продолжит с того же места."

      - name: Package.
        if: steps.build.outcome == 'success'
        run: |
          cd $REPO_NAME/out/Release
          curl -fsSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-macos-arm64-v8a.zip"
          unzip -o -q xray.zip xray -d xray-dir
          mv Telegram.app Plume.app
          plutil -replace CFBundleName -string Плюм Plume.app/Contents/Info.plist
          plutil -replace CFBundleDisplayName -string Плюм Plume.app/Contents/Info.plist
          plutil -replace CFBundleIdentifier -string ru.amdiveev.plume Plume.app/Contents/Info.plist  # не путать с официальным Telegram
          cp xray-dir/xray Plume.app/Contents/MacOS/xray
          chmod +x Plume.app/Contents/MacOS/xray
          codesign --force --deep -s - Plume.app
          mkdir artifact
          ditto -c -k --sequesterRsrc --keepParent Plume.app artifact/Plume-Mac.zip
          # Установщик для людей: окно с Plume и папкой «Программы» — перетащить и готово (zip — для автообновления).
          mkdir dmg && cp -R Plume.app dmg/ && ln -s /Applications "dmg/Программы"
          hdiutil create -volname Плюм -srcfolder dmg -ov -format UDZO artifact/Plume-Mac.dmg
          echo "$TGLITE_BUILD" > artifact/build.txt

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: Plume-Mac
          path: ${{ env.REPO_NAME }}/out/Release/artifact/
          retention-days: 5
